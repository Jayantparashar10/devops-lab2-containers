# Lab 2 - two-container setup: web app + Redis
# Start: docker compose up -d --build     Stop: docker compose down
name: lab2

services:
  web:
    build:
      context: .
      args:
        APP_VERSION: "1.0.0-compose"
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
    image: counter-app:compose
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      APP_MESSAGE: "Hello from Docker Compose"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

volumes:
  redis-data:

networks:
  backend:
